<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serene Board</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header id="header">
    <div class="header-brand">
      <img src="logo.png" alt="Serene Security" class="header-logo">
      <a href="https://measure-matrix-app-production.up.railway.app/follow-ups" class="nav-link">Follow-Ups</a>
    </div>
    <div class="header-controls">
      <div class="view-group">
        <button class="view-btn active" data-view="schedule" onclick="setView('schedule')">Schedule</button>
        <button class="view-btn" data-view="orders" onclick="setView('orders')">Orders</button>
      </div>
      <div class="filter-group">
        <button class="filter-btn" data-filter="all" onclick="setFilter('all')">All</button>
        <button class="filter-btn" data-filter="Quote" onclick="setFilter('Quote')">Quotes</button>
        <button class="filter-btn active" data-filter="Work Order" onclick="setFilter('Work Order')">Work Orders</button>
      </div>
      <input type="text" id="search" placeholder="Search jobs…" autocomplete="off">
      <span id="view-count" class="job-count"></span>
      <span id="job-count" class="job-count"></span>
      <button id="sync-btn" onclick="handleSync()">Sync</button>
    </div>
  </header>

  <!-- Loading -->
  <div id="loading" class="loading">Loading board…</div>


  <!-- Board -->
  <div id="board" class="board kanban-scroll hidden"></div>

  <!-- Modal backdrop -->
  <div id="modal-backdrop" class="modal-backdrop" style="display:none" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <span id="modal-job-id" class="modal-job-id"></span>
          <h2 id="modal-client"></h2>
        </div>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Schedule view -->
  <div id="schedule-view" class="schedule-view hidden">
    <div class="schedule-tabs">
      <button class="sched-tab active" data-stab="calendar" onclick="setScheduleTab('calendar')">Calendar</button>
      <button class="sched-tab" data-stab="scheduler" onclick="setScheduleTab('scheduler')">Scheduler</button>
    </div>
    <div id="schedule-body" class="schedule-body">
      <p style="color:#64748b;">Loading...</p>
    </div>
  </div>

  <!-- Orders view -->
  <div id="orders-view" class="orders-view hidden">
    <div id="orders-body"></div>
  </div>

  <!-- Orders add modal -->
  <div id="orders-modal-backdrop" class="modal-backdrop" style="display:none" onclick="closeOrdersModal(event)">
    <div class="modal modal-wide" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 style="font-size:16px;margin-top:0;">Add Order Items</h2>
        </div>
        <button class="modal-close" onclick="closeOrdersModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="orders-form">
          <div style="display:flex;gap:12px;flex-wrap:wrap;">
            <div class="orders-form-field" style="flex:1;min-width:120px;">
              <label class="orders-form-label">Job Number</label>
              <input id="order-job-input" type="text" class="orders-form-input" placeholder="e.g. 1694" oninput="onOrderJobInput(this.value)" autocomplete="off">
              <div id="order-job-hint" class="orders-form-hint"></div>
            </div>
            <div class="orders-form-field" style="flex:1;min-width:140px;">
              <label class="orders-form-label">Supplier</label>
              <input id="order-supplier-input" type="text" class="orders-form-input" placeholder="e.g. Darley" autocomplete="off">
            </div>
          </div>
          <div class="orders-form-field">
            <label class="orders-form-label">Items</label>
            <div style="overflow-x:auto;">
              <table class="oi-table">
                <thead><tr>
                  <th>Code</th><th>Description</th><th>Colour</th><th>Qty</th><th></th>
                </tr></thead>
                <tbody id="order-items-tbody">
                  <tr>
                    <td><input type="text" class="orders-form-input oi-code" placeholder="AN2550"></td>
                    <td><input type="text" class="orders-form-input oi-desc" placeholder="Description"></td>
                    <td><input type="text" class="orders-form-input oi-colour" placeholder="Black"></td>
                    <td><input type="number" class="orders-form-input oi-qty" value="1" min="1"></td>
                    <td><button class="orders-row-remove" onclick="removeOrderRow(this)">×</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
            <button class="orders-btn orders-btn-secondary" style="margin-top:8px;font-size:12px;padding:4px 12px;" onclick="addOrderRow()">+ Add Row</button>
          </div>
          <div class="orders-form-actions">
            <button class="orders-btn orders-btn-secondary" onclick="closeOrdersModal()">Cancel</button>
            <button class="orders-btn orders-btn-primary" onclick="submitAddItem()">Add to List</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Export email modal -->
  <div id="export-modal-backdrop" class="modal-backdrop" style="display:none" onclick="closeExportModal(event)">
    <div class="modal modal-wide" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 style="font-size:16px;margin-top:0;">Email Order</h2>
          <div style="font-size:12px;color:#64748b;margin-top:2px;">Reference: <span id="export-ref" style="font-family:monospace;color:#94a3b8;"></span></div>
        </div>
        <button class="modal-close" onclick="closeExportModal()">&times;</button>
      </div>
      <div class="modal-body">
        <textarea id="export-body" class="orders-form-input orders-form-textarea" rows="18" style="font-family:monospace;font-size:12px;width:100%;"></textarea>
        <div class="orders-form-actions" style="margin-top:12px;">
          <button class="orders-btn orders-btn-secondary" onclick="closeExportModal()">Close</button>
          <button class="orders-btn orders-btn-primary" onclick="copyExportEmail()">Copy to Clipboard</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display:none"></div>

  <script src="app.js"></script>
</body>
</html>
